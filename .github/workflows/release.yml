name: Release NuGet tools

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore CoreCli.sln
      - name: Build
        run: dotnet build CoreCli.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true
      - name: Run unit tests
        run: dotnet test CoreCli.sln --configuration Release --no-build --no-restore
      - name: Pack NuGet tools
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must contain a semantic version, such as v2.0.1." >&2
            exit 1
          fi
          dotnet pack CoreCli.sln \
            --configuration Release \
            --output artifacts/packages \
            --property:Version="$version" \
            -p:TreatWarningsAsErrors=true
      - name: Install and verify packed tools
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          tool_dir="$RUNNER_TEMP/corecli-tools"
          mkdir -p "$tool_dir"
          dotnet tool install CoreCli.DateTime --tool-path "$tool_dir" --source artifacts/packages --version "$version"
          dotnet tool install CoreCli.IpInfo --tool-path "$tool_dir" --source artifacts/packages --version "$version"
          dotnet tool install CoreCli.UpInfo --tool-path "$tool_dir" --source artifacts/packages --version "$version"
          "$tool_dir/datetime" --version
          "$tool_dir/datetime" --culture us --format G --utc
          "$tool_dir/ipinfo" --local --ipv6
          "$tool_dir/upinfo" --up-only --compact
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify-and-pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Validate Trusted Publishing configuration
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "Set the GitHub Actions repository secret NUGET_USER to the NuGet.org profile name that owns the Trusted Publishing policy." >&2
            exit 1
          fi
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        shell: bash
        run: |
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists."
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "Version $version"
